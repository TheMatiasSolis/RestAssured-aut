plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

dependencies {

    // REST Assured
    testImplementation 'io.rest-assured:rest-assured:5.3.1'

    // Cucumber + TestNG
    testImplementation 'io.cucumber:cucumber-java:7.11.1'
    testImplementation 'io.cucumber:cucumber-testng:7.11.1'
    testImplementation 'org.testng:testng:7.10.2'

    // Logging
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'

    // JSON
    implementation 'org.json:json:20230618'
    implementation 'com.google.code.gson:gson:2.10'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.1'

    // Validación JSON
    implementation 'org.everit.json:org.everit.json.schema:1.5.1'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'

    implementation 'javax.json:javax.json-api:1.1.4'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'org.hamcrest:hamcrest-core:1.3'
}

test {
    useTestNG()

    scanForTestClasses = false

    testLogging {
        showStandardStreams = true
    }

    systemProperty "cucumber.filter.tags",
            System.getProperty("cucumber.filter.tags")

    if (project.hasProperty("threads")) {
        jvmArgs "-Ddataproviderthreadcount=${project.property('threads')}"
    }
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

tasks.register("certificacion") {
    dependsOn clean, test
}